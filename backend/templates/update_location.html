{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="container mt-5">
    <h2>Оновити місцезнаходження</h2>
    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label for="location">Ваше місцезнаходження (широта, довгота):</label>
            <input id="location" name="location" type="text" class="form-control" placeholder="Клікніть на мапу" readonly required>
        </div>
        <div id="map" style="height: 400px; width: 100%;" class="mb-3"></div>
        <button type="submit" class="btn btn-primary">Зберегти</button>
    </form>
</div>
{% endblock %}

{% block scripts %}

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="{% static 'js/update_location.js' %}"></script>
{% endblock %}
